# ============================================
# ARGOCD APPLICATION - AI SERVICE
# ============================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-service
  namespace: argocd
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: product-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: product-platform

  source:
    repoURL: https://github.com/YOUR_ORG/product-comparison-platform.git  # Update with your repo
    targetRevision: main
    path: k8s/ai-service

  destination:
    server: https://kubernetes.default.svc
    namespace: product-platform

  # Sync policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Ignore differences
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/minReplicas
        - /spec/maxReplicas

  revisionHistoryLimit: 10