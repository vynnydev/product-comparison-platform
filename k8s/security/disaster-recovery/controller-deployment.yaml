apiVersion: apps/v1
kind: Deployment
metadata:
  name: disaster-recovery-controller
  namespace: security
  labels:
    app: disaster-recovery-controller
    app.kubernetes.io/name: disaster-recovery-controller
    app.kubernetes.io/part-of: security-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: disaster-recovery-controller
  template:
    metadata:
      labels:
        app: disaster-recovery-controller
    spec:
      serviceAccountName: disaster-recovery-sa
      
      containers:
        - name: controller
          image: 347277718217.dkr.ecr.us-east-1.amazonaws.com/disaster-recovery-controller:latest
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          
          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: TERRAFORM_STATE_BUCKET
              value: "product-comparison-terraform-state"
            - name: TERRAFORM_STATE_KEY
              value: "dev/terraform.tfstate"
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: slack-webhook
                  key: SLACK_WEBHOOK_URL
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: TOKEN
            - name: GITHUB_REPO
              value: "vynnydev/product-comparison-platform"
          
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: disaster-recovery-sa
  namespace: security
  annotations:
    # IRSA para Terraform e AWS access
    eks.amazonaws.com/role-arn: arn:aws:iam::347277718217:role/product-comparison-dev-disaster-recovery-role
---
apiVersion: v1
kind: Service
metadata:
  name: disaster-recovery-controller
  namespace: security
  labels:
    app: disaster-recovery-controller
spec:
  type: ClusterIP
  selector:
    app: disaster-recovery-controller
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP