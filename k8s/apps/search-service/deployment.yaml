apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: product-platform
  labels:
    app: search-service
    app.kubernetes.io/name: search-service
    app.kubernetes.io/part-of: product-comparison
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      serviceAccountName: search-service-sa
      containers:
        - name: search-service
          image: 347277718217.dkr.ecr.us-east-1.amazonaws.com/product-comparison-dev-search-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: shared-config
            - secretRef:
                name: opensearch-credentials
            - secretRef:
                name: rabbitmq-credentials
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev,cloud"
            - name: SERVER_PORT
              value: "8082"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 5