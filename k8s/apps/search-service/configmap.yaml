apiVersion: v1
kind: ConfigMap
metadata:
  name: search-service-config
  namespace: product-platform
  labels:
    app: search-service
    app.kubernetes.io/name: search-service
    app.kubernetes.io/part-of: product-comparison
data:
  SPRING_PROFILES_ACTIVE: "cloud"
  SERVER_PORT: "8082"
  
  # Database
  DB_NAME: "searchdb"
  DB_PORT: "5432"
  
  # RabbitMQ
  RABBITMQ_PORT: "5671"
  RABBITMQ_SSL_ENABLED: "true"
  
  # Redis
  REDIS_PORT: "6379"
  REDIS_SSL: "false"
  
  # OpenSearch
  OPENSEARCH_PORT: "443"
  OPENSEARCH_SCHEME: "https"
  OPENSEARCH_USERNAME: "admin"
  OPENSEARCH_ENABLED: "true"
  
  # Queues
  RABBITMQ_QUEUE_PRODUCT_EVENTS: "search.product.events"
  RABBITMQ_QUEUE_ANALYSIS_EVENTS: "search.analysis.events"
  RABBITMQ_EXCHANGE_PRODUCTS: "products.exchange"
  RABBITMQ_EXCHANGE_ANALYSIS: "analysis.exchange"