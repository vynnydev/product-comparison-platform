apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: product-platform
  labels:
    app: product-service
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: product-comparison
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      serviceAccountName: product-service-sa
      containers:
        - name: product-service
          image: 347277718217.dkr.ecr.us-east-1.amazonaws.com/product-comparison-dev-product-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: shared-config
            - secretRef:
                name: db-credentials
            - secretRef:
                name: rabbitmq-credentials
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev,cloud"
            - name: SERVER_PORT
              value: "8080"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5