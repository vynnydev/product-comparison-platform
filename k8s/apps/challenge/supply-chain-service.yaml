apiVersion: apps/v1
kind: Deployment
metadata:
  name: supply-chain-service
  namespace: cognitiva-analytics
  labels:
    app: supply-chain-service
    app.kubernetes.io/name: supply-chain-service
    app.kubernetes.io/part-of: challenge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supply-chain-service
  template:
    metadata:
      labels:
        app: supply-chain-service
        app.kubernetes.io/name: supply-chain-service
    spec:
      containers:
        - name: supply-chain-service
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: shared-config
          env:
            - name: SERVICE_NAME
              value: "supply-chain-service"
            - name: SERVICE_PORT
              value: "3004"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: supply-chain-service
  namespace: cognitiva-analytics
  labels:
    app: supply-chain-service
    app.kubernetes.io/name: supply-chain-service
spec:
  type: ClusterIP
  selector:
    app: supply-chain-service
  ports:
    - name: http
      port: 3004
      targetPort: 80