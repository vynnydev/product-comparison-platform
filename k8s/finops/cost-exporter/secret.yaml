apiVersion: v1
kind: Secret
metadata:
  name: cost-exporter-secret
  namespace: finops
  labels:
    app: cost-exporter
    app.kubernetes.io/name: cost-exporter
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: finops
type: Opaque
stringData:
  # AWS Credentials (se não usar IRSA)
  # Recomendado: usar IRSA ao invés de credentials estáticas
  # AWS_ACCESS_KEY_ID: "YOUR_ACCESS_KEY"
  # AWS_SECRET_ACCESS_KEY: "YOUR_SECRET_KEY"
  
  # Slack webhook para alertas (opcional)
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/XXXXXXXXX/YYYYYYYYY/ZZZZZZZZZZ"
  
  # Discord webhook para alertas (opcional)
  DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/XXXXXXXXXX/YYYYYYYY"