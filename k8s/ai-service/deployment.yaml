# ============================================
# DEPLOYMENT - AI Service
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: product-platform
  labels:
    app: ai-service
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: product-comparison
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ai-service
        app.kubernetes.io/name: ai-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: ai-service-sa
      
      # Init container para aguardar dependências
      initContainers:
      - name: wait-for-rabbitmq
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z $RABBITMQ_HOST 5672; do echo waiting for rabbitmq; sleep 2; done']
        envFrom:
        - configMapRef:
            name: shared-config
      
      containers:
      - name: ai-service
        image: 347277718217.dkr.ecr.us-east-1.amazonaws.com/product-comparison-dev-ai-service:latest
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        
        # Environment variables from ConfigMaps
        envFrom:
        - configMapRef:
            name: shared-config
        - configMapRef:
            name: ai-service-config
        
        # Environment variables from Secrets
        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD
        - name: RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: RABBITMQ_USERNAME
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: RABBITMQ_PASSWORD
        
        # Override server port
        - name: SERVER_PORT
          value: "8081"
        
        # Spring datasource URL (AI Service has its own DB or shares)
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/aidb"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD
        
        # Spring RabbitMQ
        - name: SPRING_RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: RABBITMQ_HOST
        - name: SPRING_RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: RABBITMQ_USERNAME
        - name: SPRING_RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: RABBITMQ_PASSWORD
        
        # AWS Region for Bedrock
        - name: AWS_REGION
          value: "us-east-1"
        
        # Resource limits (AI Service may need more memory)
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      
      # Anti-affinity para distribuir pods
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: ai-service
              topologyKey: kubernetes.io/hostname
      
      terminationGracePeriodSeconds: 30
---
# ============================================
# SERVICE - AI Service
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: product-platform
  labels:
    app: ai-service
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: product-comparison
spec:
  type: ClusterIP
  selector:
    app: ai-service
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    protocol: TCP
---
# ============================================
# SERVICE ACCOUNT - AI Service (com IRSA para Bedrock)
# ============================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-service-sa
  namespace: product-platform
  labels:
    app: ai-service
  # annotations:
    # ⚠️  IMPORTANTE: Descomente e configure a role ARN após criar no Terraform
    # Esta role precisa ter permissão para invocar Bedrock
    # eks.amazonaws.com/role-arn: arn:aws:iam::347277718217:role/ai-service-bedrock-role
---
# ============================================
# HORIZONTAL POD AUTOSCALER
# ============================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-service-hpa
  namespace: product-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80