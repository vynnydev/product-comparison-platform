# ============================================
# FRONTEND DEPLOYMENT
# Cognitiva Solutions - Challenge Project
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: product-platform
  labels:
    app: frontend
    project: cognitiva-solutions
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        project: cognitiva-solutions
    spec:
      containers:
        - name: frontend
          image: 347277718217.dkr.ecr.us-east-1.amazonaws.com/product-comparison-dev-frontend:latest
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: NODE_ENV
              value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: product-platform
  labels:
    app: frontend
  annotations:
    # This creates an AWS Network Load Balancer
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: frontend