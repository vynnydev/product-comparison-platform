apiVersion: v1
kind: ConfigMap
metadata:
  name: env-config
  namespace: product-platform
  labels:
    app.kubernetes.io/part-of: product-comparison
    environment: prod
data:
  # Environment
  ENVIRONMENT: "prod"
  
  # Logging
  LOG_LEVEL: "WARN"
  LOG_FORMAT: "json"
  
  # Spring
  SPRING_PROFILES_ACTIVE: "prod,cloud"
  
  # Features
  ENABLE_SWAGGER: "false"
  ENABLE_DEBUG_ENDPOINTS: "false"
  ENABLE_METRICS: "true"
  
  # Cache
  CACHE_TTL_SECONDS: "600"
  
  # Rate Limiting
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
  
  # Tracing
  TRACING_ENABLED: "true"
  TRACING_SAMPLE_RATE: "0.1"
  
  # Security
  SECURITY_HEADERS_ENABLED: "true"
  CORS_ALLOWED_ORIGINS: "https://app.cognitiva.solutions,https://cognitiva.solutions"