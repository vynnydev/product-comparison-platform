apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  spec:
    template:
      spec:
        containers:
          - name: product-service
            resources:
              requests:
                cpu: "500m"
                memory: "768Mi"
              limits:
                cpu: "1500m"
                memory: "1536Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  spec:
    template:
      spec:
        containers:
          - name: ai-service
            resources:
              requests:
                cpu: "500m"
                memory: "768Mi"
              limits:
                cpu: "1500m"
                memory: "2Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  spec:
    template:
      spec:
        containers:
          - name: search-service
            resources:
              requests:
                cpu: "500m"
                memory: "768Mi"
              limits:
                cpu: "1000m"
                memory: "1536Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  spec:
    template:
      spec:
        containers:
          - name: frontend
            resources:
              requests:
                cpu: "200m"
                memory: "512Mi"
              limits:
                cpu: "500m"
                memory: "1Gi"