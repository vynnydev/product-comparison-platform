# Reduce resources for dev environment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  spec:
    template:
      spec:
        containers:
          - name: product-service
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  spec:
    template:
      spec:
        containers:
          - name: ai-service
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "500m"
                memory: "768Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  spec:
    template:
      spec:
        containers:
          - name: search-service
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "250m"
                memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  spec:
    template:
      spec:
        containers:
          - name: frontend
            resources:
              requests:
                cpu: "50m"
                memory: "128Mi"
              limits:
                cpu: "100m"
                memory: "256Mi"