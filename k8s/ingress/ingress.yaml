# ============================================
# INGRESS - Product Comparison Platform
# ============================================
# Requer AWS Load Balancer Controller instalado
# 
# Para instalar:
# helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
#   -n kube-system \
#   --set clusterName=product-comparison-dev \
#   --set serviceAccount.create=false \
#   --set serviceAccount.name=aws-load-balancer-controller
# ============================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: product-platform-ingress
  namespace: product-platform
  labels:
    app.kubernetes.io/part-of: product-comparison
  annotations:
    # AWS ALB Ingress Controller
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    
    # SSL/TLS (descomente se tiver certificado ACM)
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:347277718217:certificate/xxxxx
    
    # Tags
    alb.ingress.kubernetes.io/tags: Environment=dev,Project=product-comparison
spec:
  ingressClassName: alb
  rules:
  # Regra principal - API Gateway style routing
  - http:
      paths:
      # Product Service endpoints
      - path: /api/products
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 8080
      
      - path: /model
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 8080
      
      # AI Service endpoints
      - path: /api/ai
        pathType: Prefix
        backend:
          service:
            name: ai-service
            port:
              number: 8081
      
      # Health checks (opcional - para debugging)
      - path: /product-service/actuator
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 8080
      
      - path: /ai-service/actuator
        pathType: Prefix
        backend:
          service:
            name: ai-service
            port:
              number: 8081
      
      # Root path - redirect to product service
      - path: /
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 8080
---
# ============================================
# ALTERNATIVE: LoadBalancer Services (sem Ingress)
# ============================================
# Se preferir expor cada serviço diretamente com NLB
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: product-service-lb
  namespace: product-platform
  labels:
    app: product-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: product-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service-lb
  namespace: product-platform
  labels:
    app: ai-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: ai-service
  ports:
  - name: http
    port: 80
    targetPort: 8081
    protocol: TCP