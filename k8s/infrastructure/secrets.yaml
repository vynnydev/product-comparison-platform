# ============================================
# SECRETS - Database Credentials
# ============================================
# ⚠️  IMPORTANTE: Em produção, use External Secrets Operator
# ou AWS Secrets Manager com IRSA para gerenciar secrets!
#
# Para criar o secret via kubectl com valores reais:
# kubectl create secret generic db-credentials \
#   --namespace product-platform \
#   --from-literal=DB_USERNAME=postgres \
#   --from-literal=DB_PASSWORD=<sua-senha-rds>
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: product-platform
  labels:
    app.kubernetes.io/part-of: product-comparison
type: Opaque
stringData:
  # ⚠️  ALTERE ESTAS CREDENCIAIS!
  # Use os valores do terraform output ou AWS Console
  DB_USERNAME: "postgres"
  DB_PASSWORD: "CHANGE_ME_TO_RDS_PASSWORD"
---
# ============================================
# SECRETS - RabbitMQ Credentials
# ============================================
# Para criar via kubectl:
# kubectl create secret generic rabbitmq-credentials \
#   --namespace product-platform \
#   --from-literal=RABBITMQ_USERNAME=admin \
#   --from-literal=RABBITMQ_PASSWORD=<sua-senha-mq>
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: product-platform
  labels:
    app.kubernetes.io/part-of: product-comparison
type: Opaque
stringData:
  # ⚠️  ALTERE ESTAS CREDENCIAIS!
  # Use os valores do terraform.tfvars
  RABBITMQ_USERNAME: "admin"
  RABBITMQ_PASSWORD: "CHANGE_ME_TO_MQ_PASSWORD"
---
# ============================================
# SECRETS - AWS Bedrock (for AI Service)
# ============================================
# Nota: Se estiver usando IRSA (IAM Roles for Service Accounts),
# não precisa de credentials aqui - o SDK usa as roles automaticamente.
# 
# Este secret é apenas se precisar de access keys explícitas.
# ============================================
# apiVersion: v1
# kind: Secret
# metadata:
#   name: aws-credentials
#   namespace: product-platform
# type: Opaque
# stringData:
#   AWS_ACCESS_KEY_ID: "AKIAXXXXXXXXXXXXXXXX"
#   AWS_SECRET_ACCESS_KEY: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
#   AWS_REGION: "us-east-1"