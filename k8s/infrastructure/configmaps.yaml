# ============================================
# CONFIGMAP - Shared Configuration
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-config
  namespace: product-platform
  labels:
    app.kubernetes.io/part-of: product-comparison
data:
  # Spring Profiles
  SPRING_PROFILES_ACTIVE: "cloud"
  
  # Database Config (Host from RDS - will be updated after terraform)
  DB_HOST: "product-comparison-dev-postgresql.c0j6s6gus7cz.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "productdb"
  
  # RabbitMQ Config (Host from Amazon MQ - will be updated after terraform)
  RABBITMQ_HOST: "b-8b802f5f-83c6-4049-963d-220933e0a82b.mq.us-east-1.on.aws"
  RABBITMQ_PORT: "5672"
  
  # Application Config
  SERVER_PORT: "8080"
  
  # Logging
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_HACKERRANK: "DEBUG"
---
# ============================================
# CONFIGMAP - Product Service
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-service-config
  namespace: product-platform
  labels:
    app: product-service
    app.kubernetes.io/part-of: product-comparison
data:
  # Product Service specific config
  PRODUCT_SERVICE_NAME: "product-service"
  
  # RabbitMQ Exchange/Queue
  RABBITMQ_EXCHANGE: "products.exchange"
  RABBITMQ_QUEUE: "product.events"
  RABBITMQ_ROUTING_KEY: "product.created"
  
  # Cache (Redis - if using)
  CACHE_ENABLED: "false"
---
# ============================================
# CONFIGMAP - AI Service
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-service-config
  namespace: product-platform
  labels:
    app: ai-service
    app.kubernetes.io/part-of: product-comparison
data:
  # AI Service specific config
  AI_SERVICE_NAME: "ai-service"
  SERVER_PORT: "8081"
  
  # AI Provider Configuration
  AI_ENABLED: "true"
  AI_PROVIDER: "bedrock"
  AI_BEDROCK_REGION: "us-east-1"
  AI_BEDROCK_MODEL: "anthropic.claude-3-5-sonnet-20241022-v2:0"
  
  # RabbitMQ Consumer
  RABBITMQ_EXCHANGE: "products.exchange"
  RABBITMQ_QUEUE: "product.events"