# ============================================
# CI PIPELINE - TERRAFORM
# Validate, Security Scan, Plan, Apply, Destroy
# ============================================

name: CI - Terraform

on:
  push:
    branches: [main, development, improvement]
    paths:
      - 'infrastructure/terraform/**'
      - '!infrastructure/terraform/modules/bootstrap/**'
      - '!infrastructure/terraform/modules/backend/**'
      - '.github/workflows/ci-terraform.yml'
  pull_request:
    branches: [main, development, improvement]
    paths:
      - 'infrastructure/terraform/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirm_destroy:
        description: 'Type DESTROY to confirm destruction'
        required: false
        type: string
        default: ''

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.6.0'
  TF_WORKING_DIR: infrastructure/terraform
  TF_VAR_project_name: product-comparison
  TF_VAR_environment: dev

jobs:
  # ============================================
  # VALIDATE
  # ============================================
  validate:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    if: inputs.action != 'destroy'
    outputs:
      valid: ${{ steps.validate.outcome == 'success' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Terraform Init
        run: terraform init -backend=false

      - name: 📝 Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: ✅ Terraform Validate
        id: validate
        run: terraform validate

      - name: 📝 Validation Summary
        if: always()
        run: |
          echo "## 📋 Terraform Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Format | ${{ steps.fmt.outcome == 'success' && '✅ Passed' || '⚠️ Needs formatting' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validate | ${{ steps.validate.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # SECURITY SCAN - CHECKOV
  # ============================================
  security-checkov:
    name: "Security Scan (Checkov)"
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.action != 'destroy'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔒 Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          output_format: cli
          soft_fail: true
          skip_check: CKV_AWS_144,CKV_AWS_145,CKV_AWS_337,CKV2_AWS_5

  # ============================================
  # SECURITY SCAN - TFSEC
  # ============================================
  security-tfsec:
    name: "Security Scan (tfsec)"
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.action != 'destroy'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔒 Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          soft_fail: true

  # ============================================
  # TERRAFORM PLAN
  # ============================================
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: [validate, security-checkov, security-tfsec]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      inputs.action != 'destroy'
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Terraform Init
        run: terraform init

      - name: 📋 Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}" \
            -detailed-exitcode \
            -out=tfplan \
            2>&1 | tee plan_output.txt || true
        continue-on-error: true

      - name: 📤 Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan_output.txt
          retention-days: 5

      - name: 📝 Plan Summary
        if: always()
        run: |
          echo "## 📋 Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f plan_output.txt ]; then
            ADDS=$(grep -oP 'Plan: \K\d+(?= to add)' plan_output.txt || echo "0")
            CHANGES=$(grep -oP '\d+(?= to change)' plan_output.txt || echo "0")
            DESTROYS=$(grep -oP '\d+(?= to destroy)' plan_output.txt || echo "0")
            
            echo "| Operation | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ➕ Add | $ADDS |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔄 Change | $CHANGES |" >> $GITHUB_STEP_SUMMARY
            echo "| ➖ Destroy | $DESTROYS |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8');
            } catch (e) {
              output = 'Plan output not available';
            }
            
            const maxLength = 60000;
            const truncated = output.length > maxLength 
              ? output.substring(0, maxLength) + '\n... (truncated)'
              : output;
            
            const body = `## 📋 Terraform Plan Results
            
            <details>
            <summary>Show Plan</summary>
            
            \`\`\`hcl
            ${truncated}
            \`\`\`
            
            </details>
            
            **Checkov:** ${{ needs.security-checkov.result }}
            **tfsec:** ${{ needs.security-tfsec.result }}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
        continue-on-error: true

  # ============================================
  # TERRAFORM APPLY
  # ============================================
  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: plan
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Terraform Init
        run: terraform init

      - name: 🚀 Terraform Apply
        run: |
          terraform apply \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}" \
            -auto-approve

      - name: 📤 Get Outputs
        id: outputs
        run: |
          echo "## 🏗️ Infrastructure Applied" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| VPC ID | $(terraform output -raw vpc_id 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "| EKS Cluster | $(terraform output -raw eks_cluster_name 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "| RDS Endpoint | $(terraform output -raw rds_endpoint 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # TERRAFORM DESTROY
  # ============================================
  destroy:
    name: "💥 Terraform Destroy"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: 🔒 Validate Destroy Confirmation
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "❌ ERROR: You must type 'DESTROY' in the confirm_destroy field to proceed."
            echo ""
            echo "This is a safety measure to prevent accidental destruction."
            exit 1
          fi
          echo "✅ Destroy confirmed"

      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔧 Setup kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: 🗑️ Cleanup Kubernetes Resources
        continue-on-error: true
        run: |
          echo "Attempting to connect to EKS cluster..."
          aws eks update-kubeconfig \
            --name ${{ env.TF_VAR_project_name }}-${{ env.TF_VAR_environment }} \
            --region ${{ env.AWS_REGION }} || true
          
          echo "Deleting LoadBalancer services..."
          kubectl get svc -A -o json 2>/dev/null | jq -r '.items[] | select(.spec.type=="LoadBalancer") | "\(.metadata.namespace) \(.metadata.name)"' | while read ns name; do
            echo "  Deleting: $ns/$name"
            kubectl delete svc $name -n $ns --wait=false 2>/dev/null || true
          done
          
          echo "Waiting 60s for LoadBalancers to be released..."
          sleep 60
          
          echo "Deleting namespaces..."
          for ns in sonarqube monitoring argocd product-platform; do
            kubectl delete namespace $ns --grace-period=0 --force --wait=false 2>/dev/null || true
          done
          
          sleep 30

      - name: 🔍 Terraform Init
        run: terraform init

      - name: 📋 Terraform Plan Destroy
        run: |
          terraform plan -destroy \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}" \
            -out=destroy.tfplan

      - name: 💥 Terraform Destroy
        run: terraform apply -auto-approve destroy.tfplan

      - name: 📝 Destroy Summary
        if: always()
        run: |
          echo "## 💥 Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Destroyed Resources:" >> $GITHUB_STEP_SUMMARY
          echo "- VPC and networking" >> $GITHUB_STEP_SUMMARY
          echo "- EKS cluster and node groups" >> $GITHUB_STEP_SUMMARY
          echo "- RDS PostgreSQL" >> $GITHUB_STEP_SUMMARY
          echo "- RabbitMQ (AmazonMQ)" >> $GITHUB_STEP_SUMMARY
          echo "- Lambda functions" >> $GITHUB_STEP_SUMMARY
          echo "- API Gateway" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔒 Preserved:" >> $GITHUB_STEP_SUMMARY
          echo "- S3 bucket (Terraform state)" >> $GITHUB_STEP_SUMMARY
          echo "- DynamoDB table (State locking)" >> $GITHUB_STEP_SUMMARY
          echo "- ECR images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💰 Cost Savings:" >> $GITHUB_STEP_SUMMARY
          echo "- Before: ~\$250/month" >> $GITHUB_STEP_SUMMARY
          echo "- After: ~\$0.50/month" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # SECURITY SUMMARY
  # ============================================
  security-summary:
    name: "Security Summary"
    runs-on: ubuntu-latest
    needs: [security-checkov, security-tfsec, plan]
    if: always() && inputs.action != 'destroy'

    steps:
      - name: 📊 Generate Security Summary
        run: |
          echo "## 🔒 Terraform Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Checkov | ${{ needs.security-checkov.result == 'success' && '✅ Passed' || '⚠️ Check findings' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| tfsec | ${{ needs.security-tfsec.result == 'success' && '✅ Passed' || '⚠️ Check findings' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ Security scans run with soft_fail=true. Review findings in logs." >> $GITHUB_STEP_SUMMARY