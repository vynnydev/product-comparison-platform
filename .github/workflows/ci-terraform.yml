name: "CI/CD - Terraform"

on:
    push:
        branches: [main, development, improvement]
        paths:
            - "infrastructure/terraform/**"
            - ".github/workflows/ci-terraform.yml"
    pull_request:
        branches: [main, development, improvement]
        paths:
            - "infrastructure/terraform/**"
    workflow_dispatch:
        inputs:
            action:
                description: "Action to perform"
                required: true
                default: "plan"
                type: choice
                options:
                    - plan
                    - apply
                    - destroy
            confirm_destroy:
                description: "Type DESTROY to confirm destruction"
                required: false
                type: string

env:
    TF_VERSION: "1.6.0"
    AWS_REGION: "us-east-1"
    TF_WORKING_DIR: "infrastructure/terraform"

concurrency:
    group: terraform-${{ github.ref }}
    cancel-in-progress: false

jobs:
    validate:
        name: "Validate & Format"
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}

            - name: Terraform Format Check
              id: fmt
              run: |
                  cd ${{ env.TF_WORKING_DIR }} && terraform fmt -check -recursive
              continue-on-error: true

            - name: Terraform Init
              id: init
              run: |
                  cd ${{ env.TF_WORKING_DIR }} && terraform init -backend=false

            - name: Terraform Validate
              id: validate
              run: |
                  cd ${{ env.TF_WORKING_DIR }} && terraform validate -no-color

    security-scan:
        name: "Security Scan (Checkov)"
        runs-on: ubuntu-latest
        needs: validate
        defaults:
            run:
                shell: bash

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run Checkov
              uses: bridgecrewio/checkov-action@v12
              with:
                  directory: ${{ env.TF_WORKING_DIR }}
                  framework: terraform
                  output_format: cli
                  soft_fail: true
                  skip_check: CKV_AWS_144,CKV_AWS_145,CKV_AWS_337

    tfsec-scan:
        name: "Security Scan (tfsec)"
        runs-on: ubuntu-latest
        needs: validate
        defaults:
            run:
                shell: bash

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run tfsec
              uses: aquasecurity/tfsec-action@v1.0.3
              with:
                  working_directory: ${{ env.TF_WORKING_DIR }}
                  soft_fail: true

    plan:
        name: "Terraform Plan"
        runs-on: ubuntu-latest
        needs: [validate, security-scan, tfsec-scan]
        defaults:
            run:
                shell: bash

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Terraform Init
              run: |
                  cd ${{ env.TF_WORKING_DIR }} && terraform init

            - name: Terraform Plan
              id: plan
              run: |
                  cd ${{ env.TF_WORKING_DIR }} && terraform plan \
                    -var="db_password=${{ secrets.DB_PASSWORD }}" \
                    -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}" \
                    -out=tfplan \
                    -no-color

            - name: Upload Plan Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: terraform-plan-${{ github.sha }}
                  path: ${{ env.TF_WORKING_DIR }}/tfplan
                  retention-days: 5

    apply:
        name: "Terraform Apply"
        runs-on: ubuntu-latest
        needs: plan
        if: |
            (github.event_name == 'push' && contains(fromJson('["refs/heads/main", "refs/heads/improvement"]'), github.ref)) ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        defaults:
            run:
                shell: bash

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Terraform Init
              run: |
                  cd ${{ env.TF_WORKING_DIR }} && terraform init

            - name: Download Plan Artifact
              uses: actions/download-artifact@v4
              with:
                  name: terraform-plan-${{ github.sha }}
                  path: ${{ env.TF_WORKING_DIR }}

            - name: Terraform Apply
              run: |
                  cd ${{ env.TF_WORKING_DIR }} && terraform apply -auto-approve tfplan

            - name: Output Summary
              run: |
                  echo "## Terraform Apply Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
                  echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  cd ${{ env.TF_WORKING_DIR }} && terraform output -no-color >> $GITHUB_STEP_SUMMARY

    destroy:
        name: "Terraform Destroy"
        runs-on: ubuntu-latest
        needs: validate
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        defaults:
            run:
                shell: bash

        steps:
            - name: Verify Destroy Confirmation
              run: |
                  if [[ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]]; then
                    echo "::error::Destroy not confirmed. Type DESTROY in confirm_destroy input."
                    exit 1
                  fi

            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Terraform Init
              run: |
                  cd ${{ env.TF_WORKING_DIR }} && terraform init

            - name: Terraform Destroy
              run: |
                  cd ${{ env.TF_WORKING_DIR }} && terraform destroy \
                    -var="db_password=${{ secrets.DB_PASSWORD }}" \
                    -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}" \
                    -auto-approve
