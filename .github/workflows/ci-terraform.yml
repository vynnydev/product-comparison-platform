# ============================================
# CI PIPELINE - TERRAFORM
# Automated Infrastructure Management
# ============================================
# Features:
# - Auto-detects and creates backend if missing
# - Plan/Apply/Destroy infrastructure
# - NEVER destroys backend (S3 + DynamoDB)
# - Auto-apply on main, manual approval on other branches
# ============================================

name: CI - Terraform

on:
  push:
    branches: [main, development, improvement]
    paths:
      - 'infrastructure/terraform/**'
      - '!infrastructure/terraform/modules/bootstrap/**'
      - '!infrastructure/terraform/modules/backend/**'
      - '.github/workflows/ci-terraform.yml'
  pull_request:
    branches: [main, development, improvement]
    paths:
      - 'infrastructure/terraform/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirm_destroy:
        description: 'Type DESTROY to confirm (only for destroy action)'
        required: false
        type: string
        default: ''

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.6.0'
  TF_WORKING_DIR: infrastructure/terraform
  TF_BOOTSTRAP_DIR: infrastructure/terraform/modules/bootstrap
  TF_VAR_project_name: product-comparison
  TF_VAR_environment: dev

jobs:
  # ============================================
  # CHECK & CREATE BACKEND (if needed)
  # ============================================
  setup-backend:
    name: "🗄️ Setup Backend"
    runs-on: ubuntu-latest
    if: inputs.action != 'destroy'
    outputs:
      backend_exists: ${{ steps.check.outputs.exists }}
      backend_created: ${{ steps.create.outputs.created }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Check if Backend Exists
        id: check
        run: |
          BUCKET_NAME="${{ env.TF_VAR_project_name }}-${{ env.TF_VAR_environment }}-terraform-state"
          
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "✅ Backend already exists: $BUCKET_NAME"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Backend does not exist: $BUCKET_NAME"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Setup Terraform
        if: steps.check.outputs.exists == 'false'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🏗️ Create Backend
        id: create
        if: steps.check.outputs.exists == 'false'
        working-directory: ${{ env.TF_BOOTSTRAP_DIR }}
        run: |
          echo "🚀 Creating Terraform backend..."
          
          terraform init
          terraform apply -auto-approve
          
          echo "✅ Backend created successfully!"
          echo "created=true" >> $GITHUB_OUTPUT

      - name: 📝 Backend Summary
        run: |
          echo "## 🗄️ Backend Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.exists }}" == "true" ]; then
            echo "✅ Backend already exists" >> $GITHUB_STEP_SUMMARY
          else
            echo "🆕 Backend was created" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**S3 Bucket:** ${{ env.TF_VAR_project_name }}-${{ env.TF_VAR_environment }}-terraform-state" >> $GITHUB_STEP_SUMMARY
          echo "**DynamoDB Table:** ${{ env.TF_VAR_project_name }}-${{ env.TF_VAR_environment }}-terraform-locks" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # VALIDATE
  # ============================================
  validate:
    name: "✅ Terraform Validate"
    runs-on: ubuntu-latest
    needs: setup-backend
    if: inputs.action != 'destroy'
    outputs:
      valid: ${{ steps.validate.outcome == 'success' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Terraform Init
        run: terraform init

      - name: 📝 Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: ✅ Terraform Validate
        id: validate
        run: terraform validate

      - name: 📝 Validation Summary
        if: always()
        run: |
          echo "## 📋 Terraform Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Format | ${{ steps.fmt.outcome == 'success' && '✅ Passed' || '⚠️ Needs formatting' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validate | ${{ steps.validate.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # SECURITY SCAN - CHECKOV
  # ============================================
  security-checkov:
    name: "🔒 Security Scan (Checkov)"
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.action != 'destroy'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔒 Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          output_format: cli
          soft_fail: true
          skip_check: CKV_AWS_144,CKV_AWS_145,CKV_AWS_337,CKV2_AWS_5

  # ============================================
  # SECURITY SCAN - TFSEC
  # ============================================
  security-tfsec:
    name: "🔒 Security Scan (tfsec)"
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.action != 'destroy'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔒 Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          soft_fail: true

  # ============================================
  # TERRAFORM PLAN
  # ============================================
  plan:
    name: "📋 Terraform Plan"
    runs-on: ubuntu-latest
    needs: [validate, security-checkov, security-tfsec]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      inputs.action != 'destroy'
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Terraform Init
        run: terraform init

      - name: 📋 Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}" \
            -out=tfplan \
            -detailed-exitcode \
            2>&1 | tee plan_output.txt || EXIT_CODE=$?
          
          # Exit code 0 = no changes, 1 = error, 2 = changes present
          if [ "${EXIT_CODE:-0}" -eq 2 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Plan has changes to apply"
          elif [ "${EXIT_CODE:-0}" -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected"
          else
            echo "❌ Plan failed"
            exit 1
          fi
        continue-on-error: false

      - name: 📤 Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan_output.txt
          retention-days: 5

      - name: 📝 Plan Summary
        if: always()
        run: |
          echo "## 📋 Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f plan_output.txt ]; then
            ADDS=$(grep -oP 'Plan: \K\d+(?= to add)' plan_output.txt || echo "0")
            CHANGES=$(grep -oP '\d+(?= to change)' plan_output.txt || echo "0")
            DESTROYS=$(grep -oP '\d+(?= to destroy)' plan_output.txt || echo "0")
            
            echo "| Operation | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ➕ Add | $ADDS |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔄 Change | $CHANGES |" >> $GITHUB_STEP_SUMMARY
            echo "| ➖ Destroy | $DESTROYS |" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================
  # TERRAFORM APPLY
  # ============================================
  apply:
    name: "🚀 Terraform Apply"
    runs-on: ubuntu-latest
    needs: plan
    # CORREÇÃO: Agora aplica em QUALQUER branch configurada (push) ou via workflow_dispatch
    if: |
      needs.plan.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref_name != '' && github.event.pull_request == null) ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
      )

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Terraform Init
        run: terraform init

      - name: 📥 Download Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      - name: 🚀 Terraform Apply
        run: |
          echo "🚀 Applying Terraform changes..."
          echo "Branch: ${{ github.ref_name }}"
          echo "Trigger: ${{ github.event_name }}"
          echo ""
          
          if [ -f tfplan ]; then
            echo "📋 Using saved plan file..."
            terraform apply -auto-approve tfplan
          else
            echo "📋 Running fresh apply..."
            terraform apply \
              -var="db_password=${{ secrets.DB_PASSWORD }}" \
              -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}" \
              -auto-approve
          fi

      - name: 📤 Get Outputs
        id: outputs
        run: |
          echo "## 🏗️ Infrastructure Applied Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| VPC ID | \`$(terraform output -raw vpc_id 2>/dev/null || echo 'N/A')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| EKS Cluster | \`$(terraform output -raw eks_cluster_name 2>/dev/null || echo 'N/A')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| RDS Endpoint | \`$(terraform output -raw rds_endpoint 2>/dev/null || echo 'N/A')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| RabbitMQ Console | \`$(terraform output -raw rabbitmq_console_url 2>/dev/null || echo 'N/A')\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Connect to EKS:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "aws eks update-kubeconfig --name $(terraform output -raw eks_cluster_name 2>/dev/null || echo 'CLUSTER_NAME') --region ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # TERRAFORM DESTROY (Protected)
  # ============================================
  destroy:
    name: "💥 Terraform Destroy"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: 🔒 Validate Destroy Confirmation
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "## ❌ Destroy Cancelled" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "You must type **DESTROY** in the confirm_destroy field." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This is a safety measure to prevent accidental destruction." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ Destroy confirmed"

      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔧 Setup kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: 🗑️ Cleanup Kubernetes Resources
        continue-on-error: true
        run: |
          echo "🔗 Connecting to EKS cluster..."
          aws eks update-kubeconfig \
            --name ${{ env.TF_VAR_project_name }}-${{ env.TF_VAR_environment }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Cluster may not exist"
          
          echo "🗑️ Deleting LoadBalancer services..."
          kubectl get svc -A -o json 2>/dev/null | jq -r '.items[] | select(.spec.type=="LoadBalancer") | "\(.metadata.namespace) \(.metadata.name)"' | while read ns name; do
            [ -n "$ns" ] && [ -n "$name" ] && kubectl delete svc $name -n $ns --wait=false 2>/dev/null || true
          done
          
          echo "⏳ Waiting 60s for LoadBalancers to be released..."
          sleep 60
          
          echo "🗑️ Deleting namespaces..."
          for ns in sonarqube monitoring argocd product-platform; do
            kubectl delete namespace $ns --grace-period=0 --force --wait=false 2>/dev/null || true
          done
          
          sleep 30

      - name: 🔍 Terraform Init
        run: terraform init

      - name: 📋 Terraform Plan Destroy
        run: |
          terraform plan -destroy \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}" \
            -out=destroy.tfplan

      - name: 💥 Terraform Destroy
        run: terraform apply -auto-approve destroy.tfplan

      - name: 📝 Destroy Summary
        if: always()
        run: |
          echo "## 💥 Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Destroyed:" >> $GITHUB_STEP_SUMMARY
          echo "- VPC and networking" >> $GITHUB_STEP_SUMMARY
          echo "- EKS cluster and node groups" >> $GITHUB_STEP_SUMMARY
          echo "- RDS PostgreSQL (⚠️ DATA LOST)" >> $GITHUB_STEP_SUMMARY
          echo "- RabbitMQ (AmazonMQ)" >> $GITHUB_STEP_SUMMARY
          echo "- Lambda functions" >> $GITHUB_STEP_SUMMARY
          echo "- API Gateway" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔒 Preserved (NEVER deleted):" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ S3 bucket (Terraform state)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ DynamoDB table (State locking)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ECR images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💰 Cost Savings:" >> $GITHUB_STEP_SUMMARY
          echo "- Before: ~\$250/month" >> $GITHUB_STEP_SUMMARY
          echo "- After: ~\$0.50/month" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔄 To Recreate:" >> $GITHUB_STEP_SUMMARY
          echo "Run this workflow again with action: **apply**" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # SECURITY SUMMARY
  # ============================================
  security-summary:
    name: "📊 Security Summary"
    runs-on: ubuntu-latest
    needs: [security-checkov, security-tfsec, plan]
    if: always() && inputs.action != 'destroy'

    steps:
      - name: 📊 Generate Security Summary
        run: |
          echo "## 🔒 Terraform Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Checkov | ${{ needs.security-checkov.result == 'success' && '✅ Passed' || '⚠️ Check findings' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| tfsec | ${{ needs.security-tfsec.result == 'success' && '✅ Passed' || '⚠️ Check findings' }} |" >> $GITHUB_STEP_SUMMARY