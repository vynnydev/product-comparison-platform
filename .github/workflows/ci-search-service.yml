# ============================================
# CI/CD Pipeline - Search Service
# ============================================

name: CI - Search Service

on:
  push:
    branches:
      - main
      - develop
      - improvement
    paths:
      - 'backend/services/search-service/**'
      - '.github/workflows/ci-search-service.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/services/search-service/**'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: product-comparison-dev-search-service
  SERVICE_NAME: search-service
  SERVICE_PATH: backend/services/search-service

jobs:
  # ============================================
  # BUILD & TEST
  # ============================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          mvn clean compile -B

      - name: Run Tests
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          mvn test -B

      - name: Package JAR
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          mvn package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: search-service-jar
          path: ${{ env.SERVICE_PATH }}/target/*.jar
          retention-days: 1

  # ============================================
  # SECURITY SCAN
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: OWASP Dependency Check
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          mvn org.owasp:dependency-check-maven:check -B || true
        continue-on-error: true

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: ${{ env.SERVICE_PATH }}/target/dependency-check-report.html
          retention-days: 7

  # ============================================
  # BUILD & PUSH DOCKER IMAGE
  # ============================================
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/improvement')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: search-service-jar
          path: ${{ env.SERVICE_PATH }}/target/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: ${{ env.SERVICE_PATH }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Output image details
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "🐳 Image pushed successfully!"
          echo "📦 Repository: $ECR_REGISTRY/$ECR_REPOSITORY"
          echo "🏷️ Tags: $IMAGE_TAG, latest"