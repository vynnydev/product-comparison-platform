# ============================================
# CI PIPELINE - PRODUCT SERVICE
# ============================================

name: CI - Product Service

on:
  push:
    branches: [main, development, improvement]
    paths:
      - 'backend/services/product-service/**'
      - '.github/workflows/ci-product-service.yml'
  pull_request:
    branches: [main, development, improvement]
    paths:
      - 'backend/services/product-service/**'

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: product-comparison-dev-product-service
  JAVA_VERSION: '21'
  SERVICE_PATH: backend/services/product-service

jobs:
  # ============================================
  # BUILD & TEST
  # ============================================
  build-and-test:
    name: "Build & Test"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: productdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 📦 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-product-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-product-

      - name: 🔨 Build with Maven
        run: mvn clean compile -DskipTests -B

      - name: 🧪 Run Tests
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn test -Dspring.profiles.active=test -B

      - name: 📊 Generate Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Product Service Tests
          path: ${{ env.SERVICE_PATH }}/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false
        continue-on-error: true

      - name: 📦 Package JAR
        run: mvn package -DskipTests -B

      - name: 📤 Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-service-jar
          path: ${{ env.SERVICE_PATH }}/target/*.jar
          retention-days: 1

  # ============================================
  # SONARQUBE ANALYSIS
  # ============================================
  sonarqube:
    name: "SonarQube Analysis"
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 🔍 SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn verify sonar:sonar \
            -DskipTests \
            -Dsonar.projectKey=product-service \
            -Dsonar.projectName="Product Service" \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -B
        continue-on-error: true

  # ============================================
  # BUILD & PUSH DOCKER IMAGE
  # ============================================
  docker-build-push:
    name: "Docker Build & Push"
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: product-service-jar
          path: ${{ env.SERVICE_PATH }}/target/

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏷️ Generate image tags
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image_tag=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image_latest=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest" >> $GITHUB_OUTPUT

      - name: 🐳 Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ steps.meta.outputs.image_tag }} \
            -t ${{ steps.meta.outputs.image_latest }} \
            ${{ env.SERVICE_PATH }}

      - name: 🔒 Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image_tag }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: 🚀 Push to ECR
        run: |
          docker push ${{ steps.meta.outputs.image_tag }}
          docker push ${{ steps.meta.outputs.image_latest }}

      - name: 📝 Summary
        run: |
          echo "## 🚀 Product Service Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ steps.meta.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY