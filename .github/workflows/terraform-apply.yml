# ============================================
# TERRAFORM APPLY - INFRASTRUCTURE
# ============================================
# Creates or updates the main infrastructure.
# Requires the backend (S3 + DynamoDB) to exist.
#
# Can be triggered manually or on push to main.
# ============================================

name: Terraform - Apply Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
      deploy_k8s:
        description: 'Deploy Kubernetes resources after apply?'
        required: true
        default: false
        type: boolean
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '!infrastructure/terraform/modules/bootstrap/**'
      - '!infrastructure/terraform/modules/backend/**'
      - '.github/workflows/terraform-apply.yml'

env:
  AWS_REGION: us-east-1
  TF_VAR_project_name: product-comparison
  TF_VAR_environment: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  # ============================================
  # TERRAFORM PLAN/APPLY
  # ============================================
  terraform:
    name: "Terraform ${{ github.event.inputs.action || 'plan' }}"
    runs-on: ubuntu-latest
    outputs:
      eks_cluster_name: ${{ steps.outputs.outputs.eks_cluster_name }}

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: 🔍 Check Backend Exists
        id: check-backend
        run: |
          BUCKET_NAME="${{ env.TF_VAR_project_name }}-${{ env.TF_VAR_environment }}-terraform-state"
          if aws s3 ls "s3://$BUCKET_NAME" 2>&1 | grep -q 'NoSuchBucket'; then
            echo "❌ Backend S3 bucket does not exist!"
            echo "Run 'Terraform - Bootstrap Backend' workflow first."
            exit 1
          else
            echo "✅ Backend exists: $BUCKET_NAME"
          fi

      - name: 🔍 Terraform Init
        run: terraform init

      - name: ✅ Terraform Validate
        run: terraform validate

      - name: 📋 Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}" \
            -out=tfplan

      - name: 🚀 Terraform Apply
        if: github.event.inputs.action == 'apply' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: terraform apply -auto-approve tfplan

      - name: 📤 Get Outputs
        id: outputs
        if: github.event.inputs.action == 'apply' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "eks_cluster_endpoint=$(terraform output -raw eks_cluster_endpoint 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "vpc_id=$(terraform output -raw vpc_id 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          
          echo "## 🏗️ Infrastructure Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| VPC ID | $(terraform output -raw vpc_id 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "| EKS Cluster | $(terraform output -raw eks_cluster_name 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "| RDS Endpoint | $(terraform output -raw rds_endpoint 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # DEPLOY KUBERNETES RESOURCES (Optional)
  # ============================================
  deploy-k8s:
    name: "Deploy Kubernetes Resources"
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event.inputs.deploy_k8s == 'true' && github.event.inputs.action == 'apply'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔧 Setup kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: 🔗 Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.TF_VAR_project_name }}-${{ env.TF_VAR_environment }} \
            --region ${{ env.AWS_REGION }}

      - name: 📁 Create Namespaces
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace product-platform --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

      - name: 📊 Deploy Monitoring Stack
        continue-on-error: true
        run: |
          if [ -d "k8s/monitoring" ]; then
            kubectl apply -f k8s/monitoring/
            echo "✅ Monitoring deployed"
          else
            echo "⚠️ k8s/monitoring not found, skipping"
          fi

      - name: 🔧 Deploy Infrastructure Resources
        continue-on-error: true
        run: |
          if [ -d "k8s/infrastructure" ]; then
            kubectl apply -f k8s/infrastructure/
            echo "✅ Infrastructure resources deployed"
          else
            echo "⚠️ k8s/infrastructure not found, skipping"
          fi

      - name: ⏳ Wait for Pods
        run: |
          echo "Waiting for pods to be ready..."
          sleep 30
          kubectl get pods -A

      - name: 📝 Deployment Summary
        run: |
          echo "## 🚀 Kubernetes Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Namespaces:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get namespaces >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pods:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -A >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # FINAL SUMMARY
  # ============================================
  summary:
    name: "Generate Summary"
    runs-on: ubuntu-latest
    needs: [terraform, deploy-k8s]
    if: always() && (github.event.inputs.action == 'apply' || github.event_name == 'push')

    steps:
      - name: 📊 Final Summary
        run: |
          echo "## 📊 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform | ${{ needs.terraform.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kubernetes | ${{ needs.deploy-k8s.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Configure kubectl:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "aws eks update-kubeconfig --name ${{ env.TF_VAR_project_name }}-${{ env.TF_VAR_environment }} --region ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY