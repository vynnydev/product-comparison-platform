# ============================================
# DEVSECOPS PIPELINE - FULL SECURITY SCAN
# SAST, DAST, Dependency Check, Container Scan
# ============================================
# This is a comprehensive security scan that runs:
# - Weekly (Sunday at midnight)
# - On push to main/develop
# - Manually via workflow_dispatch
# ============================================

name: DevSecOps - Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly security scan - Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Run full scan including container builds'
        required: false
        default: true
        type: boolean

env:
  JAVA_VERSION: '21'

jobs:
  # ============================================
  # DEPENDENCY VULNERABILITY CHECK (OWASP)
  # ============================================
  dependency-check:
    name: "OWASP Dependency Check"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: product-service
            path: backend/services/product-service
          - name: ai-service
            path: backend/services/ai-service

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 🔍 OWASP Dependency Check - ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.path }}
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            -Dformats=HTML,JSON \
            -B || true
        continue-on-error: true

      - name: 📤 Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-${{ matrix.service.name }}
          path: |
            ${{ matrix.service.path }}/target/dependency-check-report.html
            ${{ matrix.service.path }}/target/dependency-check-report.json
          retention-days: 30

  # ============================================
  # SAST - CODEQL ANALYSIS
  # ============================================
  sast-codeql:
    name: "SAST (CodeQL)"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['java']

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 🔧 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: 🔨 Build for CodeQL
        run: |
          cd backend/services/product-service && mvn compile -DskipTests -B || true
          cd ../ai-service && mvn compile -DskipTests -B || true
        continue-on-error: true

      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ============================================
  # SAST - SEMGREP
  # ============================================
  sast-semgrep:
    name: "SAST (Semgrep)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/spring
            p/security-audit
            p/secrets
            p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

  # ============================================
  # SECRET SCANNING (GITLEAKS)
  # ============================================
  secret-scan:
    name: "Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ============================================
  # CONTAINER IMAGE SCANNING
  # ============================================
  container-scan:
    name: "Container Scan (Trivy)"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: product-service
            path: backend/services/product-service
          - name: ai-service
            path: backend/services/ai-service

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 📦 Build JAR
        working-directory: ${{ matrix.service.path }}
        run: mvn package -DskipTests -B
        continue-on-error: true

      - name: 🐳 Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ matrix.service.name }}:scan \
            ${{ matrix.service.path }}
        continue-on-error: true

      - name: 🔒 Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service.name }}:scan
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
        continue-on-error: true

  # ============================================
  # KUBERNETES MANIFEST SCANNING
  # ============================================
  k8s-scan:
    name: "K8s Manifest Scan"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Run Kubesec - Product Service
        uses: controlplaneio/kubesec-action@v0.0.2
        with:
          input: k8s/product-service/deployment.yaml
        continue-on-error: true

      - name: 🔍 Run Kubesec - AI Service
        uses: controlplaneio/kubesec-action@v0.0.2
        with:
          input: k8s/ai-service/deployment.yaml
        continue-on-error: true

      - name: 🔒 Run Trivy K8s config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'k8s/'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

  # ============================================
  # TERRAFORM SECURITY SCAN
  # ============================================
  terraform-scan:
    name: "Terraform Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔒 Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          output_format: cli
          soft_fail: true
          skip_check: CKV_AWS_144,CKV_AWS_145,CKV_AWS_337
        continue-on-error: true

      - name: 🔒 Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/terraform
          soft_fail: true
        continue-on-error: true

  # ============================================
  # DOCKERFILE LINTING
  # ============================================
  dockerfile-lint:
    name: "Dockerfile Lint (Hadolint)"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Run Hadolint - Product Service
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/services/product-service/Dockerfile
          failure-threshold: warning
        continue-on-error: true

      - name: 🔍 Run Hadolint - AI Service
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/services/ai-service/Dockerfile
          failure-threshold: warning
        continue-on-error: true

  # ============================================
  # SECURITY REPORT SUMMARY
  # ============================================
  security-summary:
    name: "Security Summary"
    runs-on: ubuntu-latest
    needs: [dependency-check, sast-codeql, sast-semgrep, secret-scan, k8s-scan, terraform-scan, dockerfile-lint]
    if: always()

    steps:
      - name: 📊 Generate Security Summary
        run: |
          echo "## 🔒 DevSecOps Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies | OWASP | ${{ needs.dependency-check.result == 'success' && '✅ Passed' || '⚠️ Review' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST | CodeQL | ${{ needs.sast-codeql.result == 'success' && '✅ Passed' || '⚠️ Review' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST | Semgrep | ${{ needs.sast-semgrep.result == 'success' && '✅ Passed' || '⚠️ Review' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets | Gitleaks | ${{ needs.secret-scan.result == 'success' && '✅ Passed' || '⚠️ Review' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| K8s | Kubesec/Trivy | ${{ needs.k8s-scan.result == 'success' && '✅ Passed' || '⚠️ Review' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| IaC | Checkov/tfsec | ${{ needs.terraform-scan.result == 'success' && '✅ Passed' || '⚠️ Review' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | Hadolint | ${{ needs.dockerfile-lint.result == 'success' && '✅ Passed' || '⚠️ Review' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📅 Scan completed: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ All scans run with soft_fail=true to avoid blocking the pipeline." >> $GITHUB_STEP_SUMMARY