# Application Configuration
spring.application.name=product-service
server.port=8080

# Active Profile (local or cloud)
spring.profiles.active=${SPRING_PROFILE:local}

# JSON Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.root=INFO
logging.level.com.hackerrank.sample=DEBUG
logging.level.org.springframework.web=INFO

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# RabbitMQ Configuration (DEFAULT VALUES)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Queue Configuration
rabbitmq.exchange.products=products.exchange
rabbitmq.routing-key.product-created=product.created
rabbitmq.routing-key.product-updated=product.updated