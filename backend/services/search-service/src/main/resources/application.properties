# ============================================
# SEARCH SERVICE - LOCAL PROFILE
# ============================================

spring.application.name=search-service
server.port=8082

# H2 Database (local development)
spring.datasource.url=jdbc:h2:mem:searchdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ============================================
# RABBITMQ (Local)
# ============================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.queue.product-events=search.product.events
rabbitmq.queue.analysis-events=search.analysis.events
rabbitmq.exchange.products=products.exchange
rabbitmq.exchange.analysis=analysis.exchange

# ============================================
# REDIS (Local)
# ============================================
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.ssl=false
spring.redis.timeout=2000

# Cache settings
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# ============================================
# OPENSEARCH (Local - Docker)
# ============================================
opensearch.enabled=true
opensearch.host=localhost
opensearch.port=9200
opensearch.scheme=https
opensearch.username=admin
opensearch.password=admin
opensearch.connect-timeout=5000
opensearch.socket-timeout=60000

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.productcomparison.search=DEBUG
logging.level.org.opensearch=WARN
logging.level.org.springframework.data.redis=DEBUG