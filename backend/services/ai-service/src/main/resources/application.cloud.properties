# =================================================
# AI SERVICE - CLOUD PROFILE - Production with AWS
# =================================================

# AI Configuration
ai.enabled=true
ai.provider=bedrock
ai.bedrock.region=${AWS_REGION:us-east-1}
ai.bedrock.model=anthropic.claude-3-5-sonnet-20241022-v2:0

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/aidb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# RabbitMQ (AWS MQ with SSL)
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.ssl.enabled=true

# ============================================
# CONSUME: Product Events
# ============================================
rabbitmq.queue.product-events=product.events
rabbitmq.exchange.products=products.exchange
rabbitmq.routing-key.product-created=product.created
rabbitmq.routing-key.product-updated=product.updated

# ============================================
# PUBLISH: Analysis Events (for Search-Service)
# ============================================
rabbitmq.exchange.analysis=analysis.exchange
rabbitmq.routing-key.analysis-completed=analysis.completed

# Lambda API Gateway URL
ai.lambda.api-gateway-url=${LAMBDA_API_URL:https://your-api-id.execute-api.us-east-1.amazonaws.com/prod/ai}