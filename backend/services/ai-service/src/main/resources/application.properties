# AI Service Configuration
spring.application.name=ai-service
server.port=8081

# Active Profile (local or cloud)
spring.profiles.active=${SPRING_PROFILE:local}

# JSON Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.root=INFO
logging.level.com.hackerrank.sample=DEBUG

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always

# PUBLISH: Analysis Events (for Search-Service)
rabbitmq.exchange.analysis=analysis.exchange
rabbitmq.routing-key.analysis-completed=analysis.completed